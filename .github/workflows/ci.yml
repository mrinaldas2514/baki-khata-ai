name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baki
          POSTGRES_PASSWORD: baki
          POSTGRES_DB: baki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baki -d baki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # The tests never call Groq: the LLM and speech-to-text are always fakes.
      GROQ_API_KEY: ""
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://baki:baki@localhost:5432/baki_test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        if: matrix.database == 'sqlite'
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations build the models' schema
        if: matrix.database == 'postgresql'
        env:
          DATABASE_URL: postgresql://baki:baki@localhost:5432/baki_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests
        run: pytest -o addopts="" -q

      - name: Evaluation (rule-based parser)
        if: matrix.database == 'sqlite'
        run: python -m eval.run_eval --parser rules --no-save

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format (prettier)
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://baki-khata-api.onrender.com

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start PostgreSQL, the API and the frontend
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: The API is healthy and migrated; the frontend serves the app
        run: |
          curl --fail --silent http://localhost:8000/health | grep '"database":"ok"'
          curl --fail --silent http://localhost:8080/ | grep '<div id="root">'
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
